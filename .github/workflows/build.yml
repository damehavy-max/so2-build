name: Build DLL
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.bat
          ./vcpkg/vcpkg.exe install boost-asio:x64-windows protobuf:x64-windows openssl:x64-windows
      - name: Proto
        run: |
          ./vcpkg/installed/x64-windows/tools/protobuf/protoc.exe --cpp_out=. messages.proto
      - name: Build
        run: |
          mkdir build; cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="../vcpkg/scripts/buildsystems/vcpkg.cmake" -A x64
          cmake --build . --config Release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: market_engine_dll
          path: build/Release/market_engine.dll
